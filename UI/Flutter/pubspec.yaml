name: audio_watermark
description: Encrypted audio watermark transmission app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  dsp:
    path: ../../DSP

  flutter:
    sdk: flutter

  # Raw PCM audio record/playback via Dart streams - needed to generate and
  # detect the watermark tones directly, not just play/record whole files.
  flutter_sound: ^9.6.0

  # AES encryption (wraps pointycastle) - supports CTR mode per PROTOCOL.md
  encrypt: ^5.0.3

  # QR code generation (transmitter side) and scanning (receiver side)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Runtime permission requests (microphone, camera)
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/host_songs/
    - assets/host_song.wav

# NOTE: pin exact versions once `flutter pub get` resolves successfully -
# these are starting points, not guaranteed-latest as of your build date.
# Run `flutter pub outdated` to check for newer compatible versions.
